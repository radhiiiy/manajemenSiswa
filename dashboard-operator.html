<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Operator - Sistem Manajemen Tugas</title>
    <!-- Memanggil CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Memanggil Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="dashboard-wrapper">
        <!-- Sidebar Operator -->
        <aside class="sidebar">
            <div class="profile-section">
                <div class="profile-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg>
                </div>
                <!-- ID ini digunakan JS untuk menampilkan nama operator -->
                <h3 id="nama-user">Loading...</h3>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#" class="active">Beranda</a>
                <a href="#">Manajemen user</a>
                <a href="#">Manajemen kelas</a>
            </nav>

            <a href="/api/logout" class="logout-btn">Keluar</a>
        </aside>

        <!-- Main Content -->
        <main class="content-area">
            <header class="content-header">
                <h1>Beranda</h1>
            </header>

            <div class="dashboard-body">
                <!-- Kartu Statistik Operator -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <p class="stat-title">Total Guru</p>
                        <h2 class="stat-number">12</h2>
                    </div>
                    <div class="stat-card">
                        <p class="stat-title">Total Siswa</p>
                        <h2 class="stat-number">12</h2>
                    </div>
                    <div class="stat-card">
                        <p class="stat-title">Total Tugas</p>
                        <h2 class="stat-number">12</h2>
                    </div>
                    <div class="stat-card">
                        <p class="stat-title">Total Kelas</p>
                        <h2 class="stat-number">12</h2>
                    </div>
                </div>

                <!-- Area Grafik Operator -->
                <div class="chart-container" style="height: auto;">
                    <h3 class="chart-title">Statistik Keseluruhan</h3>
                    
                    <div class="operator-charts-grid">
                        <div class="chart-box">
                            <h4>Jumlah Tugas per Kelas</h4>
                            <canvas id="chartKelas"></canvas>
                        </div>
                        
                        <div class="chart-box">
                            <h4>Jumlah Tugas per Guru</h4>
                            <canvas id="chartGuru"></canvas>
                        </div>

                        <div class="chart-box">
                            <h4>Persentase Tugas Selesai</h4>
                            <canvas id="chartSelesai"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Script Pengecekan Sesi & Render Grafik Operator -->
    <script>
        // 1. Cek Sesi ke Node.js
        fetch('/api/session')
            .then(response => response.json())
            .then(data => {
                if (!data.loggedin || data.role !== 'operator') {
                    window.location.href = '/login-guru.html?pesan=belum_login';
                } else {
                    document.getElementById('nama-user').textContent = data.nama_lengkap;
                }
            });

        // 2. Render Grafik 1: Bar Chart Kelas
        new Chart(document.getElementById('chartKelas').getContext('2d'), {
            type: 'bar',
            data: {
                labels: ['X RPL', 'XI RPL', 'XII RPL', 'X TKJ', 'XI TKJ'],
                datasets: [{ label: 'Jumlah Tugas', data: [15, 25, 20, 10, 30], backgroundColor: '#3498db' }]
            }
        });

        // 3. Render Grafik 2: Bar Chart Guru
        new Chart(document.getElementById('chartGuru').getContext('2d'), {
            type: 'bar',
            data: {
                labels: ['Guru A', 'Guru B', 'Guru C', 'Guru D'],
                datasets: [{ label: 'Tugas Diberikan', data: [8, 12, 5, 10], backgroundColor: '#9b59b6' }]
            }
        });

        // 4. Render Grafik 3: Doughnut Chart Persentase
        new Chart(document.getElementById('chartSelesai').getContext('2d'), {
            type: 'doughnut',
            data: {
                labels: ['Selesai', 'Belum Selesai'],
                datasets: [{ data: [75, 25], backgroundColor: ['#2ecc71', '#e74c3c'] }]
            },
            options: { cutout: '60%' }
        });
    </script>
</body>
</html>
