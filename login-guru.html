<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Guru - Sistem Manajemen Tugas</title>
    <!-- Ini adalah baris yang memanggil CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Biru Atas -->
    <div class="header-login"></div>

    <div class="login-container">
        <div class="login-box">
            <h2>Login Guru</h2>
            
            <!-- Tempat untuk menampilkan pesan error -->
            <p id="pesan-error" style="color: red; text-align: center; margin-bottom: 15px; display: none;"></p>

            <!-- Form yang mengarah ke endpoint Node.js -->
            <form action="/api/login" method="POST">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="btn-masuk">Masuk</button>
            </form>
        </div>
    </div>

    <!-- Script untuk menangkap pesan gagal dari URL -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('pesan') === 'gagal') {
            const errorText = document.getElementById('pesan-error');
            errorText.textContent = "Username atau Password salah!";
            errorText.style.display = "block";
        } else if (urlParams.get('pesan') === 'belum_login') {
            const errorText = document.getElementById('pesan-error');
            errorText.textContent = "Anda harus login terlebih dahulu!";
            errorText.style.color = "orange";
            errorText.style.display = "block";
        }
    </script>

</body>
</html>
