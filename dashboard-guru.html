<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Guru - Sistem Manajemen Tugas</title>
    <!-- Memanggil CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Memanggil Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="profile-section">
                <div class="profile-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg>
                </div>
                <!-- ID ini digunakan JS untuk menampilkan nama dari database -->
                <h3 id="nama-user">Loading...</h3>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#" class="active">Beranda</a>
                <a href="#">Daftar Tugas</a>
                <a href="#">Tambah Tugas</a>
            </nav>

            <!-- Link mengarah ke endpoint logout Node.js -->
            <a href="/api/logout" class="logout-btn">Keluar</a>
        </aside>

        <!-- Main Content -->
        <main class="content-area">
            <header class="content-header">
                <h1>Beranda</h1>
            </header>

            <div class="dashboard-body">
                <!-- Kartu Statistik -->
                <div class="stats-grid">
                    <div class="stat-card border-red">
                        <p class="stat-title">Tugas<br>Dibuat</p>
                        <h2 class="stat-number">12</h2>
                    </div>
                    <div class="stat-card border-purple">
                        <p class="stat-title">Belum<br>Selesai</p>
                        <h2 class="stat-number">12</h2>
                    </div>
                    <div class="stat-card border-yellow">
                        <p class="stat-title">Tugas<br>Tuntas</p>
                        <h2 class="stat-number">12</h2>
                    </div>
                    <div class="stat-card border-green">
                        <p class="stat-title">Kelas</p>
                        <br>
                        <h2 class="stat-number">12</h2>
                    </div>
                </div>

                <!-- Area Grafik -->
                <div class="chart-container">
                    <h3 class="chart-title">Tren Penyelesaian Tugas Mingguan</h3>
                    <canvas id="tugasChart"></canvas>
                </div>
            </div>
        </main>
    </div>

    <!-- Script Pengecekan Sesi & Render Grafik -->
    <script>
        // 1. Cek Sesi ke Node.js
        fetch('/api/session')
            .then(response => response.json())
            .then(data => {
                if (!data.loggedin || data.role !== 'guru') {
                    window.location.href = '/login-guru.html?pesan=belum_login';
                } else {
                    document.getElementById('nama-user').textContent = data.nama_lengkap;
                }
            });

        // 2. Render Grafik Chart.js
        const ctx = document.getElementById('tugasChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
                datasets: [
                    {
                        label: 'Selesai',
                        data: [4, 20, 10, 15, 21, 27, 19],
                        borderColor: '#3498db',
                        backgroundColor: '#3498db',
                        borderWidth: 2,
                        tension: 0.1,
                        pointRadius: 4
                    },
                    {
                        label: 'Belum Selesai',
                        data: [11, 10, 15, 4, 20, 10, 27],
                        borderColor: '#e74c3c',
                        backgroundColor: '#e74c3c',
                        borderWidth: 2,
                        tension: 0.1,
                        pointRadius: 4
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, max: 30 }
                },
                plugins: {
                    legend: { position: 'top' }
                }
            }
        });
    </script>
</body>
</html>
